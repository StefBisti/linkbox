name: image
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:

permissions:
  contents: read
  packages: write # ghcr
  id-token: write # keyless cosign

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa # v0.75.0

jobs:
  image:
    needs: test
    strategy:
      matrix:
        app: [api, web]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/stefbisti/linkbox-${{ matrix.app }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build amd64 for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./${{ matrix.app }}
          platforms: linux/amd64
          load: true
          tags: app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan (fail on fixable HIGH/CRITICAL)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 app:scan

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        if: github.event_name != 'pull_request'

      - name: Sign by digest
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${{env.IMAGE}}@${{steps.push.outputs.digest}}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Create .env
        run: cp .env.example .env

      - name: Docker compose up
        run: docker compose up -d --build --wait

      - name: Run e2e tests
        run: cd ./api && npm run test:e2e

      - name: Show logs on error
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v
